name: Build and Package

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sprout-guardians-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.6.3"
  GODOT_RELEASE: "stable"

jobs:
  export:
    name: Validate, test, and export
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Godot editor and export templates
        shell: bash
        run: |
          set -euo pipefail
          GODOT_FILE="Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_linux.x86_64"
          BASE_URL="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_RELEASE}"

          curl --fail --location --retry 3 \
            "${BASE_URL}/${GODOT_FILE}.zip" \
            --output /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x "/tmp/godot/${GODOT_FILE}"
          echo "/tmp/godot" >> "$GITHUB_PATH"
          ln -s "/tmp/godot/${GODOT_FILE}" /tmp/godot/godot

          curl --fail --location --retry 3 \
            "${BASE_URL}/Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_export_templates.tpz" \
            --output /tmp/export_templates.tpz
          unzip -q /tmp/export_templates.tpz -d /tmp/export_templates
          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_RELEASE}"
          mkdir -p "$TEMPLATE_DIR"
          cp -R /tmp/export_templates/templates/. "$TEMPLATE_DIR/"

      - name: Import project and validate scripts
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path "$GITHUB_WORKSPACE" --editor --quit

      - name: Run core gameplay tests
        shell: bash
        run: |
          mkdir -p build/diagnostics
          set +e
          godot --headless --path "$GITHUB_WORKSPACE" --script res://tests/run_tests.gd \
            > build/diagnostics/core-tests.log 2>&1
          TEST_STATUS=$?
          set -e
          echo "$TEST_STATUS" > build/diagnostics/core-tests.status
          cat build/diagnostics/core-tests.log

      - name: Enforce core test result
        shell: bash
        run: |
          set -euo pipefail
          TEST_STATUS="$(cat build/diagnostics/core-tests.status)"
          if [ "$TEST_STATUS" != "0" ]; then
            echo "Core gameplay tests failed with exit code $TEST_STATUS"
            exit "$TEST_STATUS"
          fi

      - name: Export Windows, Linux, and Web builds
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/windows build/linux build/web
          godot --headless --path "$GITHUB_WORKSPACE" --export-release "Windows Desktop" build/windows/SproutGuardians.exe
          godot --headless --path "$GITHUB_WORKSPACE" --export-release "Linux" build/linux/SproutGuardians.x86_64
          godot --headless --path "$GITHUB_WORKSPACE" --export-release "Web" build/web/index.html
          chmod +x build/linux/SproutGuardians.x86_64

      - name: Launch exported Linux build
        shell: bash
        run: |
          set -euo pipefail
          set +e
          timeout 20s build/linux/SproutGuardians.x86_64 \
            --headless \
            --audio-driver Dummy \
            --quit-after 30 \
            --verbose \
            > build/diagnostics/exported-runtime.log 2>&1
          RUNTIME_STATUS=$?
          set -e
          echo "$RUNTIME_STATUS" > build/diagnostics/exported-runtime.status
          cat build/diagnostics/exported-runtime.log

          if [ "$RUNTIME_STATUS" != "0" ]; then
            echo "Exported Linux build failed to start cleanly with exit code $RUNTIME_STATUS"
            exit "$RUNTIME_STATUS"
          fi

          if grep -E "SCRIPT ERROR|Parse Error|Compile Error|Failed to load script" build/diagnostics/exported-runtime.log; then
            echo "Exported build contains script loading errors"
            exit 1
          fi

      - name: Package exports
        shell: bash
        run: |
          set -euo pipefail
          (cd build/windows && zip -q -r ../SproutGuardians-Windows-x86_64.zip .)
          tar -C build/linux -czf build/SproutGuardians-Linux-x86_64.tar.gz .
          (cd build/web && zip -q -r ../SproutGuardians-Web.zip .)

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SproutGuardians-test-diagnostics-${{ github.sha }}
          path: build/diagnostics/
          if-no-files-found: error
          retention-days: 14

      - name: Upload downloadable artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SproutGuardians-${{ github.sha }}
          path: |
            build/SproutGuardians-Windows-x86_64.zip
            build/SproutGuardians-Linux-x86_64.tar.gz
            build/SproutGuardians-Web.zip
          if-no-files-found: error
          retention-days: 14

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            build/SproutGuardians-Windows-x86_64.zip \
            build/SproutGuardians-Linux-x86_64.tar.gz \
            build/SproutGuardians-Web.zip \
            --generate-notes \
            --title "Sprout Guardians ${GITHUB_REF_NAME}"