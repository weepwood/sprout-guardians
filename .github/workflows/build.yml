name: Build and Package

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sprout-guardians-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.6.3"
  GODOT_RELEASE: "stable"

jobs:
  export:
    name: Validate, test, and export
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Godot editor and export templates
        shell: bash
        run: |
          set -euo pipefail
          GODOT_FILE="Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_linux.x86_64"
          BASE_URL="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_RELEASE}"

          curl --fail --location --retry 3 \
            "${BASE_URL}/${GODOT_FILE}.zip" \
            --output /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x "/tmp/godot/${GODOT_FILE}"
          echo "/tmp/godot" >> "$GITHUB_PATH"
          ln -s "/tmp/godot/${GODOT_FILE}" /tmp/godot/godot

          curl --fail --location --retry 3 \
            "${BASE_URL}/Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_export_templates.tpz" \
            --output /tmp/export_templates.tpz
          unzip -q /tmp/export_templates.tpz -d /tmp/export_templates
          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_RELEASE}"
          mkdir -p "$TEMPLATE_DIR"
          cp -R /tmp/export_templates/templates/. "$TEMPLATE_DIR/"

      - name: Import project and validate scripts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/diagnostics
          godot --headless --path "$GITHUB_WORKSPACE" --editor --quit \
            > build/diagnostics/import.log 2>&1
          cat build/diagnostics/import.log
          if grep -E "SCRIPT ERROR|Parse Error|Compile Error|Failed to load script|Invalid access to property|Invalid call|on a null instance" build/diagnostics/import.log; then
            echo "Project import contains runtime or script errors"
            exit 1
          fi

      - name: Run core gameplay tests
        shell: bash
        run: |
          set +e
          godot --headless --audio-driver Dummy --path "$GITHUB_WORKSPACE" --script res://tests/run_tests.gd \
            > build/diagnostics/core-tests.log 2>&1
          TEST_STATUS=$?
          set -e
          echo "$TEST_STATUS" > build/diagnostics/core-tests.status
          cat build/diagnostics/core-tests.log

      - name: Run reward-loop tests
        shell: bash
        run: |
          set +e
          godot --headless --audio-driver Dummy --path "$GITHUB_WORKSPACE" --script res://tests/run_reward_tests.gd \
            > build/diagnostics/reward-tests.log 2>&1
          REWARD_STATUS=$?
          set -e
          echo "$REWARD_STATUS" > build/diagnostics/reward-tests.status
          cat build/diagnostics/reward-tests.log

      - name: Run autonomous migration tests
        shell: bash
        run: |
          set +e
          godot --headless --audio-driver Dummy --path "$GITHUB_WORKSPACE" --script res://tests/run_autonomous_tests.gd \
            > build/diagnostics/autonomous-tests.log 2>&1
          AUTONOMOUS_STATUS=$?
          set -e
          echo "$AUTONOMOUS_STATUS" > build/diagnostics/autonomous-tests.status
          cat build/diagnostics/autonomous-tests.log

      - name: Run greed arena balance tests
        shell: bash
        run: |
          set +e
          godot --headless --audio-driver Dummy --path "$GITHUB_WORKSPACE" --script res://tests/run_greed_mode_tests.gd \
            > build/diagnostics/greed-tests.log 2>&1
          GREED_STATUS=$?
          set -e
          echo "$GREED_STATUS" > build/diagnostics/greed-tests.status
          cat build/diagnostics/greed-tests.log

      - name: Run plant survivors tests
        shell: bash
        run: |
          set +e
          godot --headless --audio-driver Dummy --path "$GITHUB_WORKSPACE" --script res://tests/run_survivor_tests.gd \
            > build/diagnostics/survivor-tests.log 2>&1
          SURVIVOR_STATUS=$?
          set -e
          echo "$SURVIVOR_STATUS" > build/diagnostics/survivor-tests.status
          cat build/diagnostics/survivor-tests.log

      - name: Run UI scene smoke tests
        shell: bash
        run: |
          set +e
          godot --headless --audio-driver Dummy --path "$GITHUB_WORKSPACE" --script res://tests/run_ui_smoke.gd \
            > build/diagnostics/ui-smoke.log 2>&1
          UI_STATUS=$?
          set -e
          echo "$UI_STATUS" > build/diagnostics/ui-smoke.status
          cat build/diagnostics/ui-smoke.log

      - name: Enforce test results
        shell: bash
        run: |
          set -euo pipefail
          TEST_STATUS="$(cat build/diagnostics/core-tests.status)"
          REWARD_STATUS="$(cat build/diagnostics/reward-tests.status)"
          AUTONOMOUS_STATUS="$(cat build/diagnostics/autonomous-tests.status)"
          GREED_STATUS="$(cat build/diagnostics/greed-tests.status)"
          SURVIVOR_STATUS="$(cat build/diagnostics/survivor-tests.status)"
          UI_STATUS="$(cat build/diagnostics/ui-smoke.status)"
          if [ "$TEST_STATUS" != "0" ]; then
            echo "Core gameplay tests failed with exit code $TEST_STATUS"
            exit "$TEST_STATUS"
          fi
          if [ "$REWARD_STATUS" != "0" ]; then
            echo "Reward-loop tests failed with exit code $REWARD_STATUS"
            exit "$REWARD_STATUS"
          fi
          if [ "$AUTONOMOUS_STATUS" != "0" ]; then
            echo "Autonomous migration tests failed with exit code $AUTONOMOUS_STATUS"
            exit "$AUTONOMOUS_STATUS"
          fi
          if [ "$GREED_STATUS" != "0" ]; then
            echo "Greed arena tests failed with exit code $GREED_STATUS"
            exit "$GREED_STATUS"
          fi
          if [ "$SURVIVOR_STATUS" != "0" ]; then
            echo "Plant survivors tests failed with exit code $SURVIVOR_STATUS"
            exit "$SURVIVOR_STATUS"
          fi
          if [ "$UI_STATUS" != "0" ]; then
            echo "UI scene smoke tests failed with exit code $UI_STATUS"
            exit "$UI_STATUS"
          fi

          ERROR_PATTERN="SCRIPT ERROR|Parse Error|Compile Error|Failed to load script|Invalid access to property|Invalid call|on a null instance"
          for LOG_FILE in build/diagnostics/core-tests.log build/diagnostics/reward-tests.log build/diagnostics/autonomous-tests.log build/diagnostics/greed-tests.log build/diagnostics/survivor-tests.log build/diagnostics/ui-smoke.log; do
            if grep -E "$ERROR_PATTERN" "$LOG_FILE"; then
              echo "Hidden Godot script/runtime error detected in $LOG_FILE"
              exit 1
            fi
          done

      - name: Export Windows, Web, and internal Linux smoke build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/windows build/linux-smoke build/web
          godot --headless --path "$GITHUB_WORKSPACE" --export-release "Windows Desktop" build/windows/SproutGuardians.exe
          godot --headless --path "$GITHUB_WORKSPACE" --export-release "Web" build/web/index.html
          godot --headless --path "$GITHUB_WORKSPACE" --export-release "Linux" build/linux-smoke/SproutGuardians.x86_64
          chmod +x build/linux-smoke/SproutGuardians.x86_64

      - name: Launch internal Linux smoke build
        shell: bash
        run: |
          set -euo pipefail
          set +e
          timeout 20s build/linux-smoke/SproutGuardians.x86_64 \
            --headless \
            --audio-driver Dummy \
            --quit-after 30 \
            --verbose \
            > build/diagnostics/exported-runtime.log 2>&1
          RUNTIME_STATUS=$?
          set -e
          echo "$RUNTIME_STATUS" > build/diagnostics/exported-runtime.status
          cat build/diagnostics/exported-runtime.log

          if [ "$RUNTIME_STATUS" != "0" ]; then
            echo "Exported Linux smoke build failed to start cleanly with exit code $RUNTIME_STATUS"
            exit "$RUNTIME_STATUS"
          fi

          if grep -E "SCRIPT ERROR|Parse Error|Compile Error|Failed to load script|Invalid access to property|Invalid call|on a null instance" build/diagnostics/exported-runtime.log; then
            echo "Exported build contains script loading or runtime errors"
            exit 1
          fi

      - name: Package player-facing exports
        shell: bash
        run: |
          set -euo pipefail
          (cd build/windows && zip -q -r ../SproutGuardians-Windows-x86_64.zip .)
          (cd build/web && zip -q -r ../SproutGuardians-Web.zip .)

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SproutGuardians-test-diagnostics-${{ github.sha }}
          path: build/diagnostics/
          if-no-files-found: error
          retention-days: 14

      - name: Upload downloadable artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SproutGuardians-${{ github.sha }}
          path: |
            build/SproutGuardians-Windows-x86_64.zip
            build/SproutGuardians-Web.zip
          if-no-files-found: error
          retention-days: 14

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            build/SproutGuardians-Windows-x86_64.zip \
            build/SproutGuardians-Web.zip \
            --generate-notes \
            --title "Sprout Guardians ${GITHUB_REF_NAME}"
