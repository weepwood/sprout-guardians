name: Build and Package

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# CI and pull-request builds never receive release-writing permissions.
permissions:
  contents: read

concurrency:
  group: sprout-guardians-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.7.1"
  GODOT_RELEASE: "stable"

jobs:
  export:
    name: Validate, test, and export
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Restore verified Godot archives
        uses: actions/cache@v4
        with:
          path: ~/.cache/sprout-godot
          key: sprout-godot-linux-${{ hashFiles('tools/download_godot_linux.sh') }}-full
      - name: Configure archive cache
        run: echo "GODOT_ASSET_CACHE=$HOME/.cache/sprout-godot" >> "$GITHUB_ENV"
      - name: Install Godot editor and export templates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/diagnostics
          trap 'echo "Install failed at line ${LINENO}" >> build/diagnostics/godot-install.log' ERR

          GODOT_FILE="Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_linux.x86_64"
          {
            echo "Godot version: ${GODOT_VERSION}-${GODOT_RELEASE}"
            echo "Download service: official GitHub releases, verified fallback"
            echo "Editor asset: ${GODOT_FILE}.zip"
            echo "Downloading editor"
          } > build/diagnostics/godot-install.log

          bash tools/download_godot_linux.sh editor /tmp/godot.zip
          echo "Editor downloaded: $(stat -c%s /tmp/godot.zip) bytes" >> build/diagnostics/godot-install.log

          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x "/tmp/godot/${GODOT_FILE}"
          ln -s "/tmp/godot/${GODOT_FILE}" /tmp/godot/godot
          export PATH="/tmp/godot:$PATH"
          echo "/tmp/godot" >> "$GITHUB_PATH"
          echo "Editor extracted" >> build/diagnostics/godot-install.log

          echo "Downloading export templates" >> build/diagnostics/godot-install.log
          bash tools/download_godot_linux.sh templates /tmp/export_templates.tpz
          echo "Templates downloaded: $(stat -c%s /tmp/export_templates.tpz) bytes" >> build/diagnostics/godot-install.log

          unzip -q /tmp/export_templates.tpz -d /tmp/export_templates
          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_RELEASE}"
          mkdir -p "$TEMPLATE_DIR"
          cp -R /tmp/export_templates/templates/. "$TEMPLATE_DIR/"
          echo "Templates installed: ${TEMPLATE_DIR}" >> build/diagnostics/godot-install.log

          godot --version | tee -a build/diagnostics/godot-install.log

      - name: Import project and validate scripts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/diagnostics
          godot --headless --path "$GITHUB_WORKSPACE" --editor --quit \
            > build/diagnostics/import.log 2>&1
          cat build/diagnostics/import.log
          if grep -E "SCRIPT ERROR|Parse Error|Compile Error|Failed to load script|Invalid access to property|Invalid call|on a null instance" build/diagnostics/import.log; then
            echo "Project import contains runtime or script errors"
            exit 1
          fi

      - name: Run core gameplay tests
        shell: bash
        run: |
          set +e
          godot --headless --audio-driver Dummy --path "$GITHUB_WORKSPACE" --script res://tests/run_tests.gd \
            > build/diagnostics/core-tests.log 2>&1
          TEST_STATUS=$?
          set -e
          echo "$TEST_STATUS" > build/diagnostics/core-tests.status
          cat build/diagnostics/core-tests.log

      - name: Run reward-loop tests
        shell: bash
        run: |
          set +e
          godot --headless --audio-driver Dummy --path "$GITHUB_WORKSPACE" --script res://tests/run_reward_tests.gd \
            > build/diagnostics/reward-tests.log 2>&1
          REWARD_STATUS=$?
          set -e
          echo "$REWARD_STATUS" > build/diagnostics/reward-tests.status
          cat build/diagnostics/reward-tests.log

      - name: Run autonomous migration tests
        shell: bash
        run: |
          set +e
          godot --headless --audio-driver Dummy --path "$GITHUB_WORKSPACE" --script res://tests/run_autonomous_tests.gd \
            > build/diagnostics/autonomous-tests.log 2>&1
          AUTONOMOUS_STATUS=$?
          set -e
          echo "$AUTONOMOUS_STATUS" > build/diagnostics/autonomous-tests.status
          cat build/diagnostics/autonomous-tests.log

      - name: Run greed arena balance tests
        shell: bash
        run: |
          set +e
          godot --headless --audio-driver Dummy --path "$GITHUB_WORKSPACE" --script res://tests/run_greed_mode_tests.gd \
            > build/diagnostics/greed-tests.log 2>&1
          GREED_STATUS=$?
          set -e
          echo "$GREED_STATUS" > build/diagnostics/greed-tests.status
          cat build/diagnostics/greed-tests.log

      - name: Run plant survivors tests
        shell: bash
        run: |
          set +e
          godot --headless --audio-driver Dummy --path "$GITHUB_WORKSPACE" --script res://tests/run_survivor_tests.gd \
            > build/diagnostics/survivor-tests.log 2>&1
          SURVIVOR_STATUS=$?
          set -e
          echo "$SURVIVOR_STATUS" > build/diagnostics/survivor-tests.status
          cat build/diagnostics/survivor-tests.log

      - name: Run UI scene smoke tests
        shell: bash
        run: |
          set +e
          godot --headless --audio-driver Dummy --path "$GITHUB_WORKSPACE" --script res://tests/run_ui_smoke.gd \
            > build/diagnostics/ui-smoke.log 2>&1
          UI_STATUS=$?
          set -e
          echo "$UI_STATUS" > build/diagnostics/ui-smoke.status
          cat build/diagnostics/ui-smoke.log

      - name: Run full-session survivor integration tests
        shell: bash
        run: |
          set +e
          timeout 65s godot --headless --audio-driver Dummy --path "$GITHUB_WORKSPACE" --script res://tests/run_session_integration.gd \
            > build/diagnostics/session-integration.log 2>&1
          SESSION_STATUS=$?
          set -e
          echo "$SESSION_STATUS" > build/diagnostics/session-integration.status
          cat build/diagnostics/session-integration.log

      - name: Replay actual player input in Easy and Normal
        shell: bash
        run: |
          set -euo pipefail
          timeout 90s godot --headless --audio-driver Dummy --fixed-fps 60 --disable-render-loop --path "$GITHUB_WORKSPACE" --script res://tests/run_player_input_replay.gd 2>&1 | tee build/diagnostics/player-input.log
          grep '^PLAYER_REPLAY_SUMMARY failures=0$' build/diagnostics/player-input.log
          test "$(grep -c '^PLAYER_REPLAY ' build/diagnostics/player-input.log)" -eq 2
          if grep -E 'SCRIPT ERROR|Parse Error|Compile Error|Invalid access|Invalid call|on a null instance' build/diagnostics/player-input.log; then exit 1; fi

      - name: Enforce test results
        shell: bash
        run: |
          set -euo pipefail
          TEST_STATUS="$(cat build/diagnostics/core-tests.status)"
          REWARD_STATUS="$(cat build/diagnostics/reward-tests.status)"
          AUTONOMOUS_STATUS="$(cat build/diagnostics/autonomous-tests.status)"
          GREED_STATUS="$(cat build/diagnostics/greed-tests.status)"
          SURVIVOR_STATUS="$(cat build/diagnostics/survivor-tests.status)"
          UI_STATUS="$(cat build/diagnostics/ui-smoke.status)"
          SESSION_STATUS="$(cat build/diagnostics/session-integration.status)"
          if [ "$TEST_STATUS" != "0" ]; then
            echo "Core gameplay tests failed with exit code $TEST_STATUS"
            exit "$TEST_STATUS"
          fi
          if [ "$REWARD_STATUS" != "0" ]; then
            echo "Reward-loop tests failed with exit code $REWARD_STATUS"
            exit "$REWARD_STATUS"
          fi
          if [ "$AUTONOMOUS_STATUS" != "0" ]; then
            echo "Autonomous migration tests failed with exit code $AUTONOMOUS_STATUS"
            exit "$AUTONOMOUS_STATUS"
          fi
          if [ "$GREED_STATUS" != "0" ]; then
            echo "Greed arena tests failed with exit code $GREED_STATUS"
            exit "$GREED_STATUS"
          fi
          if [ "$SURVIVOR_STATUS" != "0" ]; then
            echo "Plant survivors tests failed with exit code $SURVIVOR_STATUS"
            exit "$SURVIVOR_STATUS"
          fi
          if [ "$UI_STATUS" != "0" ]; then
            echo "UI scene smoke tests failed with exit code $UI_STATUS"
            exit "$UI_STATUS"
          fi
          if [ "$SESSION_STATUS" != "0" ]; then
            echo "Survivor integration tests failed with exit code $SESSION_STATUS"
            exit "$SESSION_STATUS"
          fi

          ERROR_PATTERN="SCRIPT ERROR|Parse Error|Compile Error|Failed to load script|Invalid access to property|Invalid call|on a null instance"
          for LOG_FILE in build/diagnostics/core-tests.log build/diagnostics/reward-tests.log build/diagnostics/autonomous-tests.log build/diagnostics/greed-tests.log build/diagnostics/survivor-tests.log build/diagnostics/ui-smoke.log build/diagnostics/session-integration.log; do
            if grep -E "$ERROR_PATTERN" "$LOG_FILE"; then
              echo "Hidden Godot script/runtime error detected in $LOG_FILE"
              exit 1
            fi
          done

      - name: Export Windows, macOS, Web, and internal Linux smoke build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/windows build/linux-smoke build/web build/macos
          godot --headless --path "$GITHUB_WORKSPACE" --export-release "Windows Desktop" build/windows/SproutGuardians.exe
          godot --headless --path "$GITHUB_WORKSPACE" --export-release "Web" build/web/index.html
          godot --headless --path "$GITHUB_WORKSPACE" --export-release "macOS" build/macos/SproutGuardians-macOS-staging.zip
          godot --headless --path "$GITHUB_WORKSPACE" --export-release "Linux" build/linux-smoke/SproutGuardians.x86_64
          chmod +x build/linux-smoke/SproutGuardians.x86_64

      - name: Launch internal Linux smoke build
        shell: bash
        run: |
          set -euo pipefail
          set +e
          timeout 20s build/linux-smoke/SproutGuardians.x86_64 \
            --headless \
            --audio-driver Dummy \
            --quit-after 120 \
            --verbose \
            -- --ci-survivors-smoke \
            > build/diagnostics/exported-runtime.log 2>&1
          RUNTIME_STATUS=$?
          set -e
          echo "$RUNTIME_STATUS" > build/diagnostics/exported-runtime.status
          cat build/diagnostics/exported-runtime.log

          if [ "$RUNTIME_STATUS" != "0" ]; then
            echo "Exported Linux smoke build failed to start cleanly with exit code $RUNTIME_STATUS"
            exit "$RUNTIME_STATUS"
          fi

          if grep -E "SCRIPT ERROR|Parse Error|Compile Error|Failed to load script|Invalid access to property|Invalid call|on a null instance" build/diagnostics/exported-runtime.log; then
            echo "Exported build contains script loading or runtime errors"
            exit 1
          fi

      - name: Package player-facing exports
        shell: bash
        run: |
          set -euo pipefail
          (cd build/windows && zip -q -r ../SproutGuardians-Windows-x86_64.zip .)
          (cd build/web && zip -q -r ../SproutGuardians-Web.zip .)
          (cd build/linux-smoke && zip -q -r ../SproutGuardians-Linux-x86_64.zip .)

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SproutGuardians-test-diagnostics-${{ github.sha }}
          path: build/diagnostics/
          if-no-files-found: error
          retention-days: 14

      - name: Upload downloadable artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SproutGuardians-${{ github.sha }}
          path: |
            build/SproutGuardians-Windows-x86_64.zip
            build/SproutGuardians-Web.zip
            build/SproutGuardians-Linux-x86_64.zip
          if-no-files-found: error
          retention-days: 14


      - name: Upload unsigned macOS staging bundle
        uses: actions/upload-artifact@v4
        with:
          name: SproutGuardians-macOS-staging-${{ github.sha }}
          path: build/macos/SproutGuardians-macOS-staging.zip
          if-no-files-found: error
          retention-days: 3

  macos-package:
    name: Sign and package macOS Universal
    needs: export
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - name: Check out packaging scripts and native icon
        uses: actions/checkout@v4

      - name: Download macOS application exported by Godot
        uses: actions/download-artifact@v4
        with:
          name: SproutGuardians-macOS-staging-${{ github.sha }}
          path: staging

      - name: Package and verify macOS disk image
        shell: bash
        env:
          MACOS_CERTIFICATE_BASE64: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && secrets.MACOS_CERTIFICATE_BASE64 || '' }}
          MACOS_CERTIFICATE_PASSWORD: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && secrets.MACOS_CERTIFICATE_PASSWORD || '' }}
          MACOS_SIGN_IDENTITY: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && secrets.MACOS_SIGN_IDENTITY || '' }}
          APPLE_ID: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && secrets.APPLE_ID || '' }}
          APPLE_TEAM_ID: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && secrets.APPLE_TEAM_ID || '' }}
          APPLE_APP_PASSWORD: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && secrets.APPLE_APP_PASSWORD || '' }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/sprout-signing.keychain-db"
          cert="$RUNNER_TEMP/sprout-signing.p12"
          trap 'rm -f "$cert"; security delete-keychain "$keychain" >/dev/null 2>&1 || true' EXIT
          if [[ -n "$MACOS_CERTIFICATE_BASE64$MACOS_SIGN_IDENTITY$APPLE_ID$APPLE_TEAM_ID$APPLE_APP_PASSWORD$MACOS_CERTIFICATE_PASSWORD" ]]; then
            : "${MACOS_CERTIFICATE_BASE64:?Missing certificate}" "${MACOS_CERTIFICATE_PASSWORD:?Missing certificate password}" "${MACOS_SIGN_IDENTITY:?Missing signing identity}" "${APPLE_ID:?Missing Apple ID}" "${APPLE_TEAM_ID:?Missing Apple team}" "${APPLE_APP_PASSWORD:?Missing notary password}"
            password="$(openssl rand -hex 24)"
            printf '%s' "$MACOS_CERTIFICATE_BASE64" | base64 -D > "$cert"
            security create-keychain -p "$password" "$keychain"
            security set-keychain-settings -lut 21600 "$keychain"
            security unlock-keychain -p "$password" "$keychain"
            security import "$cert" -k "$keychain" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
            security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain"
            security list-keychains -d user -s "$keychain"
            security find-identity -v -p codesigning "$keychain"
          fi
          version="$(grep -m1 '^config/version=' project.godot | cut -d'"' -f2)"
          bash tools/package_macos.sh staging/SproutGuardians-macOS-staging.zip build/macos "$version"

      - name: Upload macOS desktop packages
        uses: actions/upload-artifact@v4
        with:
          name: SproutGuardians-macOS-${{ github.sha }}
          path: |
            build/macos/SproutGuardians-macOS-Universal.zip
            build/macos/SproutGuardians-macOS-Universal.dmg
            build/macos/macos-signing-status.txt
          if-no-files-found: error
          retention-days: 14


  windows-smoke:
    name: Smoke-test Windows desktop executable
    needs: export
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Download Windows player build
        uses: actions/download-artifact@v4
        with:
          name: SproutGuardians-${{ github.sha }}
          path: dist

      - name: Launch exported game and enter survival
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Expand-Archive -Path "dist/SproutGuardians-Windows-x86_64.zip" -DestinationPath "build/windows" -Force
          $exe = (Resolve-Path "build/windows/SproutGuardians.exe").Path
          $log = Join-Path $env:RUNNER_TEMP "sprout-windows.log"
          $args = "--headless --audio-driver Dummy --quit-after 120 --log-file `"$log`" -- --ci-survivors-smoke"
          $proc = Start-Process -FilePath $exe -ArgumentList $args -PassThru -Wait
          if ($proc.ExitCode -ne 0) {
            throw "Windows exported game exited with code $($proc.ExitCode)"
          }
          if (-not (Test-Path $log)) {
            throw "Windows exported game did not create a runtime log"
          }
          Get-Content $log
          $errors = Select-String -Path $log -Pattern "SCRIPT ERROR|Parse Error|Compile Error|Failed to load script|Invalid access to property|Invalid call|on a null instance"
          if ($errors) {
            throw "Windows exported game contains script/runtime errors"
          }

      - name: Upload Windows runtime log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SproutGuardians-Windows-smoke-${{ github.sha }}
          path: ${{ runner.temp }}/sprout-windows.log
          if-no-files-found: warn
          retention-days: 14

  release:
    name: Publish validated release
    if: startsWith(github.ref, 'refs/tags/v') || (github.ref == 'refs/heads/main' && github.event_name == 'push')
    needs: [export, macos-package, windows-smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out release metadata
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Determine release intent
        id: intent
        shell: bash
        run: |
          set -euo pipefail
          VERSION=""
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="$GITHUB_REF_NAME"
          elif [[ "$GITHUB_REF" == refs/heads/main ]] \
            && git diff --name-only HEAD^ HEAD | grep -Fxq ".github/release-request.txt"; then
            VERSION="$(tr -d '\r\n' < .github/release-request.txt)"
          fi
          if [ -z "$VERSION" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release version: $VERSION"
            exit 1
          fi
          if [ "$VERSION" = "v0.5.0" ] || [ "$VERSION" = "v0.6.0" ] || [ "$VERSION" = "v0.7.0" ]; then
            echo "This version must use its separate complete release gate."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Download validated player builds
        if: steps.intent.outputs.publish == 'true'
        uses: actions/download-artifact@v4
        with:
          name: SproutGuardians-${{ github.sha }}
          path: dist

      - name: Download verified macOS packages
        if: steps.intent.outputs.publish == 'true'
        uses: actions/download-artifact@v4
        with:
          name: SproutGuardians-macOS-${{ github.sha }}
          path: dist

      - name: Create tag and publish release
        if: steps.intent.outputs.publish == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.intent.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release already exists: $RELEASE_VERSION"
            exit 1
          fi
          NOTES="docs/releases/$RELEASE_VERSION.md"
          NOTES_ARGS=(--generate-notes)
          if [ -f "$NOTES" ]; then
            NOTES_ARGS=(--notes-file "$NOTES")
          fi
          gh release create "$RELEASE_VERSION" \
            dist/SproutGuardians-Windows-x86_64.zip \
            dist/SproutGuardians-macOS-Universal.zip \
            dist/SproutGuardians-macOS-Universal.dmg \
            dist/SproutGuardians-Web.zip \
            --target "$GITHUB_SHA" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Sprout Guardians $RELEASE_VERSION" \
            "${NOTES_ARGS[@]}"
