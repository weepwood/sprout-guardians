name: Publish verified v0.5.0
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full main commit SHA approved after visual review
        required: true
        type: string
permissions:
  actions: read
  contents: write
concurrency:
  group: sprout-v0.5.0-release
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
      - name: Verify exact main commit and three successful workflows
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$SOURCE_SHA"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$SOURCE_SHA&per_page=100" > runs.json
          python - <<'PY'
          import json, os
          runs=json.load(open('runs.json'))['workflow_runs']
          required=['Build and Package','Survivor balance simulation','Survivor endurance and visual quality']
          for name in required:
              matches=[r for r in runs if r['name']==name and r['head_branch']=='main' and r['head_sha']==os.environ['SOURCE_SHA']]
              assert matches, f'Missing main workflow: {name}'
              latest=max(matches,key=lambda r:r['id'])
              assert latest['status']=='completed' and latest['conclusion']=='success', f'Latest workflow not successful: {name}'
              print(name, latest['id'])
              if name==required[0]:
                  with open(os.environ['GITHUB_OUTPUT'],'a') as f: f.write(f"build_run={latest['id']}\n")
          PY
      - name: Download validated builds and verify archives
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          BUILD_RUN: ${{ steps.gate.outputs.build_run }}
        run: |
          set -euo pipefail
          mkdir -p release
          gh run download "$BUILD_RUN" --repo "$GITHUB_REPOSITORY" --name "SproutGuardians-$SOURCE_SHA" --dir release
          gh run download "$BUILD_RUN" --repo "$GITHUB_REPOSITORY" --name "SproutGuardians-macOS-$SOURCE_SHA" --dir release
          cd release
          for file in SproutGuardians-Windows-x86_64.zip SproutGuardians-Linux-x86_64.zip SproutGuardians-Web.zip SproutGuardians-macOS-Universal.zip; do
            test -s "$file"
            unzip -tq "$file"
          done
          test -s SproutGuardians-macOS-Universal.dmg
          sha256sum SproutGuardians-* > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
      - name: Publish exact verified commit
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$SOURCE_SHA"
          if gh release view v0.5.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Release already exists; refusing to overwrite'
            exit 1
          fi
          if git ls-remote --exit-code --tags origin refs/tags/v0.5.0 >/dev/null 2>&1; then
            test "$(git ls-remote --tags origin refs/tags/v0.5.0 | cut -f1)" = "$SOURCE_SHA"
          fi
          gh release create v0.5.0 release/* --target "$SOURCE_SHA" --repo "$GITHUB_REPOSITORY" --title "Sprout Guardians v0.5.0" --notes-file docs/releases/v0.5.0.md
