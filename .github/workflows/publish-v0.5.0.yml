name: Publish verified v0.5.0
on:
  workflow_run:
    workflows: ['Build and Package', 'Survivor balance simulation', 'Survivor endurance and visual quality']
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full main commit SHA approved after visual review
        required: true
        type: string
permissions:
  actions: read
  contents: write
concurrency:
  group: sprout-v0.5.0-release
  cancel-in-progress: false
jobs:
  publish:
    if: (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.event.workflow_run.head_sha }}
          fetch-depth: 2
      - name: Verify exact main commit and three successful workflows
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha || github.event.workflow_run.head_sha }}
          TRIGGER: ${{ github.event_name }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          if [ "$TRIGGER" = "workflow_run" ]; then
            if [ "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" != "$SOURCE_SHA" ] || ! git diff --name-only HEAD^ HEAD | grep -Fxq ".github/release-request.txt" || [ "$(tr -d '\r\n' < .github/release-request.txt)" != "v0.5.0" ]; then
              echo "No current, explicit v0.5.0 release intent for this commit."
              echo "publish=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if gh release view v0.5.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "Release already exists; nothing to do."
              echo "publish=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$SOURCE_SHA"
          grep -Fxq 'config/version="0.5.0"' project.godot
          gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$SOURCE_SHA&per_page=100" > runs.json
          python - <<'PY'
          import json, os
          runs=json.load(open('runs.json'))['workflow_runs']
          required=['Build and Package','Survivor balance simulation','Survivor endurance and visual quality']
          selected={}
          for name in required:
              matches=[r for r in runs if r['name']==name and r['head_branch']=='main' and r['head_sha']==os.environ['SOURCE_SHA'] and r['event']=='push']
              latest=max(matches,key=lambda r:r['id']) if matches else None
              if latest is None or latest['status']!='completed' or latest['conclusion']!='success':
                  if os.environ['TRIGGER']=='workflow_run':
                      print(f'Not ready: {name}; publication not attempted')
                      with open(os.environ['GITHUB_OUTPUT'],'a') as f: f.write('publish=false\n')
                      raise SystemExit(0)
                  raise SystemExit(f'Missing or unsuccessful latest main workflow: {name}')
              selected[name]=latest['id']
              print(name, latest['id'])
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write(f"build_run={selected[required[0]]}\npublish=true\n")
          PY
      - name: Download validated builds and verify archives
        if: steps.gate.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha || github.event.workflow_run.head_sha }}
          BUILD_RUN: ${{ steps.gate.outputs.build_run }}
        run: |
          set -euo pipefail
          mkdir -p release
          gh run download "$BUILD_RUN" --repo "$GITHUB_REPOSITORY" --name "SproutGuardians-$SOURCE_SHA" --dir release
          gh run download "$BUILD_RUN" --repo "$GITHUB_REPOSITORY" --name "SproutGuardians-macOS-$SOURCE_SHA" --dir release
          cd release
          for file in SproutGuardians-Windows-x86_64.zip SproutGuardians-Linux-x86_64.zip SproutGuardians-Web.zip SproutGuardians-macOS-Universal.zip; do
            test -s "$file"
            unzip -tq "$file"
          done
          test -s SproutGuardians-macOS-Universal.dmg
          sha256sum SproutGuardians-* > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
      - name: Publish exact verified commit
        if: steps.gate.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha || github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$SOURCE_SHA"
          if gh release view v0.5.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Release already exists; refusing to overwrite'
            exit 1
          fi
          if git ls-remote --exit-code --tags origin refs/tags/v0.5.0 >/dev/null 2>&1; then
            test "$(git ls-remote --tags origin refs/tags/v0.5.0 | cut -f1)" = "$SOURCE_SHA"
          fi
          gh release create v0.5.0 release/* --target "$SOURCE_SHA" --repo "$GITHUB_REPOSITORY" --title "Sprout Guardians v0.5.0" --notes-file docs/releases/v0.5.0.md
