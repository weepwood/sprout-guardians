name: Survivor endurance and visual quality
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'scripts/**'
      - 'scenes/**'
      - 'assets/generated/**'
      - 'tests/run_endurance_benchmark.gd'
      - 'tests/run_render_capture.gd'
      - 'tests/run_render_benchmark.gd'
      - 'tests/run_save_recovery.gd'
      - '.github/workflows/survivor-quality.yml'
permissions:
  contents: read
concurrency:
  group: survivor-quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  endurance-and-render:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install editor and virtual display
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-all-errors --silent --show-error 'https://downloads.godotengine.org/?flavor=stable&platform=linux.64&slug=linux.x86_64.zip&version=4.7.1' -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
          ln -s /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 /tmp/godot/godot
          echo /tmp/godot >> "$GITHUB_PATH"
          sudo apt-get update -qq
          sudo apt-get install -y xvfb xauth libgl1-mesa-dri fonts-noto-cjk
      - name: Import project
        run: |
          set -euo pipefail
          mkdir -p build/visual build/quality
          godot --headless --editor --path . --quit > build/quality/import.log 2>&1
          if grep -E 'SCRIPT ERROR|Parse Error|Compile Error|Failed to load script' build/quality/import.log; then exit 1; fi
      - name: Ten-minute simulated endurance workload
        run: |
          set -euo pipefail
          timeout 600s godot --headless --audio-driver Dummy --fixed-fps 60 --disable-render-loop --path . --script res://tests/run_endurance_benchmark.gd 2>&1 | tee build/quality/endurance.log
          grep '^ENDURANCE_SUMMARY ' build/quality/endurance.log
          grep '^ENDURANCE_TEARDOWN ' build/quality/endurance.log
          if grep -E 'SCRIPT ERROR|Parse Error|Compile Error|Invalid access|Invalid call|on a null instance' build/quality/endurance.log; then exit 1; fi
      - name: Capture actual rendered screens
        run: |
          set -euo pipefail
          timeout 600s xvfb-run -a -s '-screen 0 1280x720x24' godot --rendering-method gl_compatibility --audio-driver Dummy --fixed-fps 60 --path . --script res://tests/run_render_capture.gd 2>&1 | tee build/quality/render.log
          test "$(find build/visual -name '*.png' | wc -l)" -eq 6
          if grep -E 'SCRIPT ERROR|Parse Error|Compile Error|Invalid access|Invalid call|on a null instance' build/quality/render.log; then exit 1; fi
      - name: Rendered low-resolution performance benchmark
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -euo pipefail
          timeout 600s xvfb-run -a -s '-screen 0 1280x720x24' godot --rendering-method gl_compatibility --audio-driver Dummy --fixed-fps 60 --resolution 640x360 --path . --script res://tests/run_render_benchmark.gd 2>&1 | tee build/quality/render-benchmark.log
          grep '^RENDER_BENCHMARK ' build/quality/render-benchmark.log
          if grep -E 'SCRIPT ERROR|Parse Error|Compile Error|Invalid access|Invalid call|on a null instance' build/quality/render-benchmark.log; then exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: endurance-and-render
          path: |
            build/quality/
            build/visual/
  save-recovery:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, archive: linux.x86_64.zip, binary: Godot_v4.7.1-stable_linux.x86_64}
          - {os: windows-latest, archive: win64.exe.zip, binary: Godot_v4.7.1-stable_win64_console.exe}
          - {os: macos-latest, archive: macos.universal.zip, binary: Godot.app/Contents/MacOS/Godot}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install editor
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-all-errors --silent --show-error "https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_${{ matrix.archive }}" -o godot-editor.zip
          unzip -q godot-editor.zip -d godot-editor
          chmod +x "godot-editor/${{ matrix.binary }}"
      - name: Save replacement and recovery
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/quality
          "godot-editor/${{ matrix.binary }}" --headless --editor --path . --quit > build/quality/save-import.log 2>&1
          "godot-editor/${{ matrix.binary }}" --headless --audio-driver Dummy --path . --script res://tests/run_save_recovery.gd 2>&1 | tee build/quality/save.log
          grep '^SAVE_RECOVERY .* true' build/quality/save.log
          if grep -E 'SCRIPT ERROR|Parse Error|Compile Error|Invalid access|Invalid call|on a null instance' build/quality/*.log; then exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: save-recovery-${{ matrix.os }}
          path: build/quality/
