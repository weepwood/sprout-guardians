name: Survivor balance simulation
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'scripts/greed/**'
      - 'scripts/systems/blessing_system.gd'
      - 'scripts/services/save_game_service.gd'
      - 'scripts/services/settings_service.gd'
      - 'scripts/ui/**'
      - 'assets/generated/**'
      - 'scenes/**'
      - 'tests/run_survivor_simulation.gd'
      - 'tests/run_survivor_tests.gd'
      - 'tools/download_godot_linux.sh'
      - '.github/workflows/survivor-simulation.yml'
permissions:
  contents: read
concurrency:
  group: survivor-simulation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - {difficulty: 0, character: 0, map: 0, reward: mixed}
          - {difficulty: 1, character: 0, map: 0, reward: mixed}
          - {difficulty: 2, character: 0, map: 0, reward: mixed}
          - {difficulty: 1, character: 0, map: 0, reward: first}
          - {difficulty: 1, character: 1, map: 0, reward: first}
          - {difficulty: 1, character: 2, map: 0, reward: first}
          - {difficulty: 1, character: 3, map: 0, reward: first}
          - {difficulty: 1, character: 4, map: 0, reward: first}
          - {difficulty: 2, character: 0, map: 0, reward: first}
          - {difficulty: 2, character: 1, map: 0, reward: first}
          - {difficulty: 2, character: 2, map: 0, reward: first}
          - {difficulty: 2, character: 3, map: 0, reward: first}
          - {difficulty: 2, character: 4, map: 0, reward: first}
          - {difficulty: 1, character: 0, map: 1, reward: first}
          - {difficulty: 1, character: 0, map: 2, reward: first}
          - {difficulty: 1, character: 0, map: 3, reward: first}
    steps:
      - uses: actions/checkout@v4
      - name: Restore verified Godot archives
        uses: actions/cache@v4
        with:
          path: ~/.cache/sprout-godot
          key: sprout-godot-linux-${{ hashFiles('tools/download_godot_linux.sh') }}-editor
      - name: Configure archive cache
        run: echo "GODOT_ASSET_CACHE=$HOME/.cache/sprout-godot" >> "$GITHUB_ENV"
      - name: Install Godot editor
        run: |
          set -euo pipefail
          bash tools/download_godot_linux.sh editor /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
          ln -s /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 /tmp/godot/godot
          echo /tmp/godot >> "$GITHUB_PATH"
      - name: Import and simulate real scene
        run: |
          set -euo pipefail
          mkdir -p build/simulation
          godot --headless --editor --path . --quit > build/simulation/import.log 2>&1
          timeout 420s godot --headless --audio-driver Dummy --fixed-fps 60 --disable-render-loop --path . --script res://tests/run_survivor_simulation.gd -- --simulation-difficulty=${{ matrix.difficulty }} --simulation-character=${{ matrix.character }} --simulation-map=${{ matrix.map }} --simulation-reward=${{ matrix.reward }} 2>&1 | tee build/simulation/results.log
          test "$(grep -c '^SIMULATION ' build/simulation/results.log)" -eq 9
          if grep -E 'SCRIPT ERROR|Parse Error|Compile Error|Failed to load script|Invalid access|Invalid call|on a null instance' build/simulation/*.log; then exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simulation-${{ matrix.difficulty }}-${{ matrix.character }}-${{ matrix.map }}-${{ matrix.reward }}
          path: build/simulation/
