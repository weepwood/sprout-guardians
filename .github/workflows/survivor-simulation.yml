name: Survivor balance simulation
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/greed/**'
      - 'scripts/systems/blessing_system.gd'
      - 'scripts/ui/**'
      - 'assets/generated/**'
      - 'scenes/**'
      - 'tests/run_survivor_simulation.gd'
      - '.github/workflows/survivor-simulation.yml'
permissions:
  contents: read
concurrency:
  group: survivor-simulation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        difficulty: [0, 1, 2]
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot editor
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-all-errors --silent --show-error 'https://downloads.godotengine.org/?flavor=stable&platform=linux.64&slug=linux.x86_64.zip&version=4.7.1' -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
          ln -s /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 /tmp/godot/godot
          echo /tmp/godot >> "$GITHUB_PATH"
      - name: Import and simulate real scene
        run: |
          set -euo pipefail
          mkdir -p build/simulation
          godot --headless --editor --path . --quit > build/simulation/import.log 2>&1
          timeout 420s godot --headless --audio-driver Dummy --fixed-fps 60 --disable-render-loop --path . --script res://tests/run_survivor_simulation.gd -- --simulation-difficulty=${{ matrix.difficulty }} | tee build/simulation/results.log
          test "$(grep -c '^SIMULATION ' build/simulation/results.log)" -eq 9
          if grep -E 'SCRIPT ERROR|Parse Error|Compile Error|Failed to load script|Invalid access|Invalid call|on a null instance' build/simulation/*.log; then exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simulation-${{ matrix.difficulty }}
          path: build/simulation/
